[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuex"
version = "0.1.0"
description = "RescueX - satellite-powered flood damage and connectivity intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "shapely>=2.0",
  "numpy>=1.24",
  "rasterio>=1.3",
  "Pillow>=10.0",
]

[project.optional-dependencies]
geospatial = [
  "geopandas>=0.14",
  "osmnx>=1.9",
]
dev = ["pytest>=8.0", "httpx>=0.27"]
ml = ["torch>=2.0", "pyyaml>=6.0"]

[project.scripts]
rescuex = "floodlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
